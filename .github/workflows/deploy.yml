name: Build & deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Refresh the bundled e-Business Register index weekly (Mondays 04:17 UTC).
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  # Never cancel a Pages deployment that is already running.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # No dependency needs an install script; skipping them removes a supply-chain vector.
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - name: Build e-Business Register search index from RIK open data
        # The app still works without the index (live lookup + manual entry), so never block a deploy on it.
        continue-on-error: true
        run: npm run registry:build
      - run: npm run build
        env:
          # Shared Google client of the public site (see docs/google-setup.md). Public identifiers, not secrets,
          # so they are repository variables. Unset: the site builds without built-in Google sign-in.
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_API_KEY: ${{ vars.GOOGLE_API_KEY }}
          VITE_GOOGLE_APP_ID: ${{ vars.GOOGLE_APP_ID }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
