name: Build & deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Refresh the bundled e-Business Register index weekly (Mondays 04:17 UTC).
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  # Never cancel a Pages deployment that is already running.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      # No dependency needs an install script; skipping them removes a supply-chain vector.
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - name: Build e-Business Register search index from RIK open data
        # The app still works without the index (live lookup + manual entry), so never block a deploy on it.
        continue-on-error: true
        run: npm run registry:build
      - run: npm run build
        env:
          # Shared Google client of the public site (see docs/google-setup.md). Public identifiers, not secrets,
          # so they are repository variables. Unset: the site builds without built-in Google sign-in.
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_API_KEY: ${{ vars.GOOGLE_API_KEY }}
          VITE_GOOGLE_APP_ID: ${{ vars.GOOGLE_APP_ID }}
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
